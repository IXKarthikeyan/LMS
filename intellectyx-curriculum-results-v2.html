<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fundamentals of UX UI Design - Curriculum Results | Intellectyx LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#963FF0; --purple-2:#B14CFF; --cyan:#42C8E9;
  --bg:#F4F4FF; --card:#FFFFFF; --text:#20172D; --muted:#8F94B5; --muted-2:#6B7090; --border:#E7E8F5;
  --green:#21865D; --red:#C94C45; --amber:#D28A1B;
  --green-d:#1B6E4C; --red-d:#A93A34; --amber-d:#8A560B;
  --green-bg:#E9F6F0; --red-bg:#FBEDEC; --amber-bg:#FDF4E3; --lav:#F1E9FE; --lav-2:#F8F6FF; --lav-3:#EFE6FC;
  --grad-rail:linear-gradient(180deg,#963FF0 0%,#8B55F1 40%,#42C8E9 100%);
  --grad-btn:linear-gradient(100deg,#963FF0 0%,#8049F0 58%,#4BA7E8 100%);
  --shadow:0 2px 12px rgba(86,60,150,.07);
  --radius:14px;
}
body{--rail-w:92px}
body.rail-expanded{--rail-w:224px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:400 14px/1.5 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);overflow-x:hidden}
h1,h2,h3,h4{font-family:Montserrat,"Segoe UI",system-ui,sans-serif;margin:0;font-weight:700;letter-spacing:-.01em;color:var(--text)}
p{margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
ul,ol{list-style:none;margin:0;padding:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:8px}
.rail :focus-visible{outline-color:#fff}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:15px;height:15px}
.ic.lg{width:24px;height:24px}
.muted{color:var(--muted-2)}

/* ---------- Left rail ---------- */
.rail-bg{position:fixed;inset:0 auto 0 0;width:calc(var(--rail-w) + 34px);background:var(--grad-rail);z-index:0;transition:width .2s}
.rail{position:fixed;inset:0 auto 0 0;width:var(--rail-w);z-index:50;display:flex;flex-direction:column;padding:18px 0;color:#fff;transition:width .2s,transform .2s}
.brand{margin:0 0 0 20px;width:48px;height:48px;display:grid;place-items:center}
.rail-toggle{position:absolute;top:84px;right:-14px;width:30px;height:30px;border-radius:50%;border:0;background:#fff;color:var(--purple);display:grid;place-items:center;box-shadow:0 2px 8px rgba(40,20,90,.25);z-index:3}
.rail-toggle .ic{width:15px;height:15px}
body.rail-expanded .rail-toggle .ic{transform:rotate(180deg)}
.rail-list{margin-top:56px;display:flex;flex-direction:column;gap:6px}
.rail-bottom{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.rail-item{position:relative;display:flex;align-items:center;gap:14px;height:46px;width:calc(100% - 16px);margin-left:16px;padding:0 0 0 17px;border:0;background:transparent;color:#fff;border-radius:24px 0 0 24px;text-align:left}
.rail-item:hover{background:rgba(255,255,255,.16)}
.rail-item.is-active{background:#fff;color:var(--purple)}
.rail-label{display:none;font:600 13px Montserrat,sans-serif;white-space:nowrap}
body.rail-expanded .rail-label{display:inline}
.rail-badge{position:absolute;left:34px;top:6px;min-width:16px;height:16px;border-radius:8px;background:#fff;color:var(--purple);font:700 10px/16px Montserrat,sans-serif;text-align:center;padding:0 4px}
.rail-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#FFD9C2,#F4A3B8);display:grid;place-items:center;color:#5a2a4a;font:700 11px Montserrat,sans-serif;border:2px solid rgba(255,255,255,.8);flex:none;margin-left:-2px}
.scrim{position:fixed;inset:0;background:rgba(32,23,45,.45);z-index:45;display:none}
.scrim.show{display:block}

/* ---------- Main ---------- */
.main{margin-left:var(--rail-w);position:relative;z-index:1;background:var(--bg);min-height:100vh;border-top-left-radius:30px;transition:margin .2s}
.topbar{position:sticky;top:0;z-index:30;height:64px;background:#fff;border-bottom:1px solid var(--border);border-top-left-radius:30px;display:flex;align-items:center;gap:14px;padding:0 28px}
.menu-btn{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:#fff;color:var(--purple);place-items:center}
.back-btn{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--muted-2);padding:8px 10px;border-radius:8px;font-weight:500}
.back-btn:hover{color:var(--purple);background:var(--lav-2)}
.crumbs ol{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;color:var(--muted-2);font-size:13px;white-space:nowrap}
.crumbs li{display:flex;align-items:center;gap:6px}
.crumbs li+li::before{content:"/";color:#C4C7DE}
.crumbs li:last-child{color:var(--text);font-weight:500}
.spacer{flex:1}
.sel-wrap{position:relative;display:inline-block}
.sel-wrap .ic{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted-2);width:16px;height:16px}
.select{appearance:none;-webkit-appearance:none;background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 36px 9px 12px;min-height:40px;max-width:100%;width:100%}
.select.pill{border-radius:22px;padding-left:18px;min-width:200px}
.wrap{max-width:1320px;margin:0 auto;padding:0 28px}
.page-head{padding:26px 0 20px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end}
.page-head h1{font-size:26px;line-height:1.25}
.sub-line{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px;color:var(--muted-2)}
.sub-line strong{font:600 15px Montserrat,sans-serif;color:var(--purple)}
.head-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:12px;font-weight:500;color:var(--muted-2)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--lav-2);border:1px solid var(--border);border-radius:20px;padding:3px 11px;font-size:12px;font-weight:500;color:var(--muted-2);white-space:nowrap}
.chip.purple{background:var(--lav);border-color:#E2D0FB;color:#6F26C4}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:22px;padding:9px 18px;min-height:40px;border:1px solid transparent;font-weight:500;white-space:nowrap;transition:background .15s,box-shadow .15s}
.btn-primary{background:var(--grad-btn);color:#fff;box-shadow:0 4px 12px rgba(150,63,240,.28)}
.btn-primary:hover{box-shadow:0 6px 16px rgba(150,63,240,.38)}
.btn-ghost{background:#fff;border-color:#D9C3F8;color:#7A2FD0}
.btn-ghost:hover{background:var(--lav)}
.btn.sm{min-height:34px;padding:6px 14px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:#fff;color:var(--purple);display:grid;place-items:center}

/* ---------- Tabs ---------- */
.tabs-band{background:#fff;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.tabs{display:flex;justify-content:center;gap:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:9px;padding:16px 24px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted-2);font-size:15px;font-weight:500;white-space:nowrap;margin-bottom:-1px;border-radius:8px 8px 0 0}
.tab:hover{color:var(--purple)}
.tab.is-active{color:var(--purple);border-bottom-color:var(--purple);background:linear-gradient(180deg,rgba(150,63,240,0),rgba(150,63,240,.08))}
.content{padding:24px 0 56px}
.stack{display:flex;flex-direction:column;gap:20px}
.subtabs{display:flex;gap:6px;padding:0 4px;overflow-x:auto;scrollbar-width:none}
.subtab{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border:1px solid var(--border);border-bottom:0;background:rgba(255,255,255,.55);color:var(--muted-2);font-weight:500;border-radius:12px 12px 0 0;white-space:nowrap;margin-bottom:-1px;position:relative;z-index:1}
.subtab.is-active{background:#fff;color:var(--purple);font-weight:600;border-color:var(--border)}
.subpanel{background:#FCFCFF;border:1px solid var(--border);border-radius:0 14px 14px 14px;padding:22px}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card-h{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.card-h h2,.card-h h3{font-size:17px}
.card-h p{color:var(--muted-2);margin-top:3px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.kpi{padding:18px 20px}
.kpi-ic{width:42px;height:42px;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--text);margin-bottom:14px}
.kpi-v{font:700 34px/1.1 Montserrat,sans-serif;letter-spacing:-.02em}
.kpi-l{font-size:15px;margin-top:4px}
.kpi-s{margin-top:14px;background:var(--lav-2);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted-2)}
.kpi-s .bar{margin-bottom:7px}
.kpi.tone-green .kpi-ic{background:var(--green-bg);color:var(--green-d)}
.kpi.tone-red .kpi-ic{background:var(--red-bg);color:var(--red-d)}
.kpi.tone-purple .kpi-ic{background:var(--lav);color:var(--purple)}
.bar{height:8px;border-radius:8px;background:#ECEDF8;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:8px;background:var(--purple)}
.bar.green>i{background:var(--green)}
.bar.cyan>i{background:var(--cyan)}
.bar.amber>i{background:repeating-linear-gradient(135deg,#D28A1B 0 6px,#E9B864 6px 10px)}
.bar.lg{height:12px}

/* overall progress */
.prog-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:stretch}
.prog-main .big{font:700 40px/1 Montserrat,sans-serif;color:var(--purple)}
.prog-main .big small{font-size:14px;font-weight:500;color:var(--muted-2);margin-left:10px;font-family:Roboto,sans-serif}
.prog-side{border-left:1px solid var(--border);padding-left:28px}
.prog-side .big{font:700 28px/1 Montserrat,sans-serif;color:#2B8CB0}
.note{background:var(--lav-2);border:1px dashed #D9C8F6;border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted-2);display:flex;gap:8px;align-items:flex-start}
.note .ic{margin-top:2px;color:var(--purple)}

/* chapters */
.chap{border:1px solid var(--border);border-radius:12px;background:#fff;overflow:hidden}
.chap+.chap{margin-top:10px}
.chap.open{border-color:#D9C3F8}
.chap-btn{width:100%;display:grid;grid-template-columns:40px minmax(120px,1.2fr) minmax(160px,1.4fr) auto 24px;gap:16px;align-items:center;padding:14px 16px;border:0;background:transparent;text-align:left}
.chap-btn:hover{background:var(--lav-2)}
.chap-num{width:36px;height:36px;border-radius:10px;background:var(--lav);color:var(--purple);display:grid;place-items:center;font:700 15px Montserrat,sans-serif}
.chap-name{font:600 15px Montserrat,sans-serif}
.chap-prog{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.chap-prog small{grid-column:1/-1;color:var(--muted-2);font-size:12px}
.chap-prog b{font-size:13px}
.chev{transition:transform .2s;color:var(--muted-2)}
.chap.open .chev{transform:rotate(180deg)}
.chap-body{border-top:1px solid var(--border);padding:6px 16px 14px;background:#FCFCFF}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:#fff}
.tbl{width:100%;border-collapse:collapse;min-width:760px}
.tbl th{background:var(--lav-3);text-align:left;font:600 13px Montserrat,sans-serif;padding:12px 14px;white-space:nowrap;color:var(--text)}
.tbl td{padding:12px 14px;border-top:1px solid var(--border);vertical-align:middle}
.tbl tbody tr:hover{background:#FAF8FF}
.tbl.mini{min-width:0}
.tbl.mini th{background:transparent;color:var(--muted-2);font:500 12px Roboto,sans-serif;padding:10px 10px 6px}
.tbl.mini td{border-top:1px solid var(--border);padding:12px 10px}
.tbl.mini tbody tr:hover{background:transparent}
.th-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;font:inherit;color:inherit;padding:0}
.th-btn .ic{width:14px;height:14px;color:var(--muted)}
th[aria-sort=ascending] .th-btn .ic,th[aria-sort=descending] .th-btn .ic{color:var(--purple)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who-t{display:flex;flex-direction:column;min-width:0}
.who-t b{font-weight:500;white-space:nowrap}
.who-t small{color:var(--muted-2);font-size:12px;white-space:nowrap}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:600 12px Montserrat,sans-serif;flex:none}
.av.sm{width:32px;height:32px;font-size:11px}
.av0{background:#EFE3FE;color:#6F26C4}.av1{background:#DDF4FB;color:#17718A}.av2{background:#E3F4EC;color:#1B6E4C}
.av3{background:#FCEFD6;color:#8A560B}.av4{background:#FBE5E3;color:#A2362F}.av5{background:#E6E8FA;color:#444B9C}
.cell-prog{display:flex;align-items:center;gap:10px;min-width:130px}
.cell-prog .bar{flex:1;min-width:60px}
.cell-prog b{font-size:13px;width:38px;text-align:right}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 8px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.badge .ic{width:13px;height:13px;stroke-width:2.4}
.badge.ok{background:var(--green-bg);color:var(--green-d)}
.badge.bad{background:var(--red-bg);color:var(--red-d)}
.badge.warn{background:var(--amber-bg);color:var(--amber-d)}
.badge.purple{background:var(--lav);color:#6F26C4}
.badge.mute{background:#EEF0F8;color:var(--muted-2)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}
.toolbar .grow{flex:1 1 260px}
.search{position:relative}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:17px;height:17px;pointer-events:none}
.input{width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 12px 9px 38px;min-height:40px;background:#fff}
.input::placeholder{color:var(--muted)}
.pager{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px}
.pager-btns{display:flex;gap:6px}
.pg{min-width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:#fff;padding:0 8px;font-weight:500}
.pg:hover:not([disabled]){background:var(--lav)}
.pg.is-active{background:var(--purple);border-color:var(--purple);color:#fff}
.pg[disabled]{opacity:.45;cursor:not-allowed}

/* summary */
.sel-row{display:grid;grid-template-columns:minmax(220px,1.1fr) repeat(3,minmax(120px,auto)) auto;gap:16px;align-items:end}
.fact{display:flex;flex-direction:column;gap:2px}
.fact span{font-size:12px;color:var(--muted-2)}
.fact b{font-weight:600;font-size:15px}
.details{margin-top:16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;background:var(--lav-2);border-radius:12px;padding:14px 16px}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:20px}
.donut-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.donut{position:relative;width:176px;height:176px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut-c b{font:700 26px Montserrat,sans-serif}
.donut-c span{font-size:12px;color:var(--muted-2);max-width:96px;line-height:1.3}
.legend{flex:1;min-width:190px;display:flex;flex-direction:column;gap:10px}
.legend li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center}
.sw{width:14px;height:14px;border-radius:4px}
.legend small{color:var(--muted-2);margin-left:4px}
.qrow{display:grid;grid-template-columns:44px minmax(0,1.3fr) minmax(150px,1fr) 128px auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}
.qrow:first-child{border-top:0}
.qno{width:38px;height:30px;border-radius:8px;background:var(--lav);color:#6F26C4;display:grid;place-items:center;font:700 12px Montserrat,sans-serif}
.qlabel{font-size:14px;min-width:0}
.qpct{display:flex;align-items:center;gap:10px}
.qpct .bar{flex:1}
.qpct b{width:44px;text-align:right}
.legend-inline{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted-2)}
.legend-inline span{display:inline-flex;align-items:center;gap:6px}

/* responses */
.qnav-wrap{display:flex;flex-direction:column;gap:10px}
.qnav{display:flex;flex-wrap:wrap;gap:8px}
.qn{position:relative;width:42px;height:40px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font:600 13px Montserrat,sans-serif;color:var(--text);display:grid;place-items:center}
.qn .mk{position:absolute;top:1px;right:4px;font:700 10px/1 Roboto,sans-serif}
.qn:hover{border-color:#C9A8F7}
.qn.t-high{background:var(--green-bg);border-color:#A8D9C1;color:var(--green-d)}
.qn.t-review{background:var(--amber-bg);border-color:#EBC27A;color:var(--amber-d)}
.qn.r-ok{background:var(--green-bg);border-color:#A8D9C1;color:var(--green-d)}
.qn.r-bad{background:var(--red-bg);border-color:#EBB5B1;color:var(--red-d)}
.qn.r-none{background:#F3F4FA;border-style:dashed;color:var(--muted-2)}
.qn.is-current{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 3px 10px rgba(150,63,240,.35)}
.qd-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.qd-num{font:700 13px Montserrat,sans-serif;color:var(--purple);margin-right:4px}
.qd-text{font-size:18px;line-height:1.45;margin-bottom:16px}
.correct-panel{background:var(--green-bg);border:1px solid #A8D9C1;border-radius:12px;padding:14px 16px;margin-bottom:16px}
.correct-panel small{display:flex;align-items:center;gap:6px;color:var(--green-d);font-weight:600;font-size:12.5px;margin-bottom:4px}
.correct-panel p{font-weight:500;font-size:15px}
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--lav-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.stat span{display:block;font-size:12px;color:var(--muted-2)}
.stat b{display:block;font:700 22px/1.2 Montserrat,sans-serif;margin-top:2px}
.stat small{color:var(--muted-2);font-size:12px}
.stat.ok b{color:var(--green-d)}
.stat.bad b{color:var(--red-d)}
.dist{display:flex;flex-direction:column;gap:12px}
.dist-row{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;background:#fff}
.dist-row.correct{border-color:var(--green);background:var(--green-bg)}
.letter{width:32px;height:32px;border-radius:9px;background:var(--lav);color:#6F26C4;display:grid;place-items:center;font:700 13px Montserrat,sans-serif}
.dist-row.correct .letter{background:var(--green);color:#fff}
.dist-top{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;margin-bottom:8px}
.dist-top span:first-child{font-weight:500}
.dist-val{color:var(--muted-2);white-space:nowrap}
.dist-val b{color:var(--text)}
.dist-row.correct .bar{background:#CBE8DA}
.dist-row.correct .bar>i{background:var(--green)}
.dist-foot{margin-top:8px}
.section-title{display:flex;flex-direction:column;gap:2px;margin:6px 0 14px}
.section-title h2{font-size:19px}
.divider{height:1px;background:var(--border);margin:26px 0 22px}
.indiv{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:20px;align-items:start}
.lpanel{padding:16px}
.lpanel-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.lpanel-h h3{font-size:16px}
.lfilters{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}
.llist{max-height:600px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:0 -6px;padding:0 6px}
.lrow{width:100%;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border:1.5px solid transparent;border-radius:12px;background:#fff;text-align:left}
.lrow:hover{background:var(--lav-2)}
.lrow.is-sel{background:var(--lav);border-color:#CDA9F6}
.lrow b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow small{color:var(--muted-2);font-size:12px}
.rhead{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px}
.rstats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
.rstats .stat b{font-size:18px}
.qcard{margin-top:18px;border:1px solid var(--border);border-radius:12px;padding:18px;background:#FCFCFF}
.qcard-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.opt{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;background:#fff}
.opt.is-correct{background:var(--green-bg);border-color:var(--green)}
.opt.is-wrong{background:var(--red-bg);border-color:var(--red)}
.opt.is-correct .letter{background:var(--green);color:#fff}
.opt.is-wrong .letter{background:var(--red);color:#fff}
.opt .tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.explain{background:var(--lav-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.explain b{display:block;font-size:12.5px;color:#6F26C4;margin-bottom:2px}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.alert.bad{background:var(--red-bg);color:var(--red-d)}
.alert.info{background:var(--lav-2);color:var(--muted-2);border:1px solid var(--border)}
.qfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cmp{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted-2);background:#fff;border:1px dashed #D9C8F6;border-radius:10px;padding:8px 12px;margin-bottom:14px}
.cmp .ic{color:var(--purple)}

/* misc */
.empty{text-align:center;padding:38px 20px;color:var(--muted-2)}
.empty .em-ic{width:52px;height:52px;border-radius:50%;background:var(--lav);color:var(--purple);display:grid;place-items:center;margin:0 auto 12px}
.empty h4{font-size:15px;color:var(--text);margin-bottom:4px}
.empty p{max-width:420px;margin:0 auto 12px}
.ack-quote{border-left:4px solid var(--purple);background:var(--lav-2);border-radius:0 12px 12px 0;padding:14px 18px;font-size:15px;line-height:1.6}
.footnote{margin-top:22px;text-align:center;font-size:12px;color:var(--muted-2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:#20172D;color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:100;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sk{background:linear-gradient(90deg,#ECEDF8,#F7F7FE,#ECEDF8);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.sk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:20px}
.sk-grid .sk{height:150px}
.sk-wide{height:220px}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sk-grid{grid-template-columns:repeat(2,1fr)}
  .sel-row{grid-template-columns:1fr 1fr}
  .details{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two-col{grid-template-columns:1fr}
  .rstats{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:1000px){
  .indiv{grid-template-columns:1fr}
  .llist{max-height:340px}
  .prog-grid{grid-template-columns:1fr}
  .prog-side{border-left:0;padding-left:0;border-top:1px solid var(--border);padding-top:18px}
  .qrow{grid-template-columns:44px minmax(0,1fr) 128px;grid-template-areas:"no lab flag" "bar bar bar"}
  .qrow .qno{grid-area:no}.qrow .qlabel{grid-area:lab}.qrow .qpct{grid-area:bar}.qrow .qflag{grid-area:flag}.qrow .qact{grid-area:bar;display:none}
}
@media (max-width:760px){
  body,body.rail-expanded{--rail-w:0px}
  .rail-bg,.rail-toggle{display:none}
  .rail{width:250px;transform:translateX(-100%);background:var(--grad-rail);border-radius:0 24px 24px 0}
  .rail.open{transform:none}
  .rail-label{display:inline !important}
  .main{border-top-left-radius:0}
  .topbar{border-top-left-radius:0;padding:0 14px;gap:8px}
  .menu-btn{display:grid}
  .crumbs li:not(:last-child){display:none}
  .crumbs li+li::before{content:none}
  .back-btn span{display:none}
  .select.pill{min-width:0;padding-left:12px}
  .org{max-width:150px}
  .wrap{padding:0 14px}
  .page-head{padding-top:18px}
  .page-head h1{font-size:21px}
  .head-actions{width:100%}
  .head-actions .field{flex:1}
  .tabs{justify-content:flex-start}
  .tab{padding:14px 16px}
  .kpis{gap:12px}
  .kpi{padding:14px}
  .kpi-v{font-size:26px}
  .kpi-l{font-size:13.5px}
  .card{padding:16px}
  .subpanel{padding:14px;border-radius:0 12px 12px 12px}
  .chap-btn{grid-template-columns:36px minmax(0,1fr) 24px;gap:10px}
  .chap-btn .chap-prog{grid-column:1/-1;order:5}
  .chap-btn .chip{display:none}
  .sel-row,.details{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:1fr}
  .rstats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qnav{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .qn{flex:none}
  .donut{margin:0 auto}
  .opt{grid-template-columns:34px minmax(0,1fr)}
  .opt .tags{grid-column:2;justify-content:flex-start}
  .tbl.mini thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .tbl.mini,.tbl.mini tbody,.tbl.mini tr,.tbl.mini td{display:block;width:100%}
  .tbl.mini tr{border-top:1px solid var(--border);padding:10px 0}
  .tbl.mini td{border:0;padding:4px 10px;display:flex;justify-content:space-between;gap:12px}
  .tbl.mini td::before{content:attr(data-label);color:var(--muted-2);font-size:12px}
  .tbl.mini td[data-label="Quiz"]::before,.tbl.mini td[data-label=""]::before{content:none}
  .tbl.mini td[data-label="Quiz"]{font-weight:600}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
/* ===== v2 additions ===== */
.badge.cyan{background:#E1F6FB;color:#17718A}
.chip.map{background:#fff}
.chip.cl{background:#E1F6FB;border-color:#BFE8F3;color:#17718A}
.chlist{display:flex;flex-direction:column;gap:10px}
.chrow{display:grid;grid-template-columns:40px minmax(120px,1fr) minmax(160px,1.6fr) minmax(190px,auto) 52px;gap:16px;align-items:center;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:#fff}
.chrow .pc{font:700 16px Montserrat,sans-serif;text-align:right}
.chrow .tx{color:var(--muted-2);font-size:13px}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf-btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 12px;text-align:left}
.pf-btn:hover{background:var(--lav-2);border-color:#D9C3F8}
.pf-btn b{display:block;font:700 28px/1.1 Montserrat,sans-serif}
.pf-btn span{font-size:13px}
.pf-btn.ok b{color:var(--green-d)}
.pf-btn.bad b{color:var(--red-d)}
.split{display:flex;height:10px;border-radius:8px;overflow:hidden;background:#ECEDF8;margin-bottom:7px}
.split .g{background:var(--green)}
.split .r{background:repeating-linear-gradient(135deg,#C94C45 0 6px,#DB7B75 6px 10px)}
.kpi-pf .kpi-ic{margin-bottom:12px}
.qov{padding:16px 20px}
.qov-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.qov-top h2{font-size:18px}
.qov-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;margin:0;background:var(--lav-2);border:1px solid var(--border);border-radius:12px}
.qov-grid div{padding:10px 14px;border-left:1px solid var(--border)}
.qov-grid div:first-child{border-left:0}
.qov-grid dt{font-size:12px;color:var(--muted-2)}
.qov-grid dd{margin:0;font:700 20px/1.2 Montserrat,sans-serif}
.num{font-variant-numeric:tabular-nums}
.sm-t{display:block;color:var(--muted-2);font-size:12px}
.mx-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px;background:#fff;max-height:660px}
.mx{border-collapse:separate;border-spacing:0;width:100%;min-width:max-content}
.mx th,.mx td{padding:7px 6px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap}
.mx thead th{position:sticky;top:0;background:var(--lav-3);z-index:2;font:600 12px Montserrat,sans-serif}
.mx .stk{position:sticky;left:0;background:#fff;z-index:1;text-align:left;min-width:230px;max-width:230px;padding:7px 12px;border-right:1px solid var(--border)}
.mx thead th.stk{z-index:4;background:var(--lav-3)}
.mx tbody tr:hover td,.mx tbody tr:hover .stk{background:#FAF8FF}
.mx .tail{padding:7px 12px;text-align:left}
.qh{display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:transparent;padding:2px 6px;border-radius:8px;min-width:48px;font:600 13px Montserrat,sans-serif}
.qh:hover{background:rgba(150,63,240,.12)}
.qh .s{font:500 11px Roboto,sans-serif;color:var(--muted-2)}
.mx .col-cur{background:#F5ECFF}
.mx thead th.col-cur{background:#E4D0FB;box-shadow:inset 0 -3px 0 var(--purple)}
.cell{display:inline-flex;align-items:center;justify-content:center;gap:3px;min-width:50px;height:32px;padding:0 6px;border-radius:8px;border:1.5px solid transparent;font:600 12.5px Montserrat,sans-serif;background:transparent}
button.cell{cursor:pointer}
button.cell:hover{box-shadow:0 0 0 2px rgba(150,63,240,.35)}
.c-ok{background:var(--green-bg);border-color:#A8D9C1;color:var(--green-d)}
.c-bad{background:var(--red-bg);border-color:#EBB5B1;color:var(--red-d)}
.c-none{background:#F3F4FA;border:1.5px dashed #C4C7DE;color:var(--muted-2)}
.c-saved{background:var(--lav);border-color:#D9C3F8;color:#6F26C4}
.c-na{color:#B6B9D2;font-weight:700}
.mx .who-t b{font-size:13.5px}
.dlg{border:0;border-radius:16px;padding:0;width:calc(100% - 32px);max-width:560px;box-shadow:0 20px 60px rgba(32,23,45,.35);color:var(--text)}
.dlg::backdrop{background:rgba(32,23,45,.5)}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--border)}
.dlg-h h2{font-size:17px}
.dlg-b{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;margin:0}
.kv dt{color:var(--muted-2);font-size:13px}
.kv dd{margin:0}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--amber-bg);border:1px solid #F0D49B;color:var(--amber-d);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:16px}
details.assump{border:1px dashed #D9C8F6;border-radius:12px;background:var(--lav-2);padding:12px 16px;font-size:13px;color:var(--muted-2)}
details.assump summary{cursor:pointer;font-weight:600;color:#6F26C4}
details.assump ul{list-style:disc;padding-left:20px;margin:8px 0 0;display:flex;flex-direction:column;gap:4px}
.toolbar .field.w{min-width:170px}
@media (max-width:1100px){.qov-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.qov-grid div:nth-child(4){border-left:0}.qov-grid div:nth-child(n+4){border-top:1px solid var(--border)}}
@media (max-width:1000px){
  .chrow{grid-template-columns:40px minmax(0,1fr) 52px;grid-template-areas:"n nm pc" "bar bar bar" "tx tx tx"}
  .chrow .chap-num{grid-area:n}.chrow .chap-name{grid-area:nm}.chrow .pc{grid-area:pc}.chrow .bar{grid-area:bar}.chrow .tx{grid-area:tx}
}
@media (max-width:760px){
  .qov-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qov-grid div{border-left:0;border-top:1px solid var(--border)}
  .qov-grid div:nth-child(-n+2){border-top:0}
  .qov-grid div:nth-child(even){border-left:1px solid var(--border)}
  .mx .stk{min-width:150px;max-width:150px;padding:6px 8px}
  .mx .stk .who-t small{display:none}
  .mx .stk .av{display:none}
  .kv{grid-template-columns:1fr}
  .pf-btn b{font-size:22px}
}
/* contain visually-hidden labels inside scroll containers */
.table-wrap,.mx-wrap,.tabs,.subtabs,.qnav,.card,.subpanel{position:relative}
.main{overflow-x:clip}

<script>
(function () {
'use strict';

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (n, cls) => '<svg class="ic ' + (cls || '') + '" aria-hidden="true" focusable="false"><use href="#i-' + n + '"/></svg>';
const pctOf = (a, b) => b ? a / b * 100 : 0;
const fmtDate = ts => new Date(ts).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
const fmtTime = ts => new Date(ts).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
const fmtDT = ts => fmtDate(ts) + ', ' + fmtTime(ts);
const fmtDur = s => Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's';
const LETTERS = 'ABCDEFGH';
const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);
const num = n => n.toLocaleString('en-US');

function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* =====================================================================
   Data model
   - Chapters contain mapped quizzes; some quizzes (ch: null) belong to the
     curriculum directly.
   - Every attempt is either 'submitted' or 'progress'. No record = not started.
   ===================================================================== */
const NOW = new Date(2026, 9, 14, 9, 30, 0);
const ASSIGNED = 120;
const CH = [
  {id:'c1', name:'UX Fundamentals'},
  {id:'c2', name:'User Research'},
  {id:'c3', name:'Wireframing'},
  {id:'c4', name:'UI Design'}
];
const CHM = {}; CH.forEach(c => CHM[c.id] = c);

const Q = (t, o, c, x, e, w) => ({t, o, c, x, e: e || 0, w: w || null, tf: o.length === 2});

const QL = [
  {id:'q1', name:'UX Basics', ch:'c1', pass:70, time:20, tries:1, qs:[
    Q('What does the term ‘UX’ stand for?', ['User Experience','User Extension','Unified Experience','Usability Exchange'], 0, 'UX stands for user experience: everything a person thinks, feels and does while using a product or service.', .12),
    Q('Which statement best describes user experience design?', ['Designing only the visual style of a product','Shaping how people feel and interact with a product across their whole journey','Writing the code that powers a product','Managing the marketing budget for a product'], 1, 'UX design looks at the complete journey, not just the look of the screens.', .02),
    Q('UX design and UI design are exactly the same discipline.', ['True','False'], 1, 'They overlap, but UX covers the overall experience and flow while UI focuses on the visual and interactive interface.', -.02, [1.4,1]),
    Q('Which deliverable is most associated with the early discovery phase of a UX project?', ['User personas','Final brand style guide','Production-ready icon set','QA test report'], 0, 'Personas summarise research findings about target users and are created early to guide decisions.', -.08, [1,1,1.6,1]),
    Q('Which of these is NOT one of the usability components described by Nielsen?', ['Learnability','Efficiency','Memorability','Brand loyalty'], 3, 'Nielsen’s components are learnability, efficiency, memorability, errors and satisfaction. Brand loyalty is a business outcome, not a usability component.', -.3, [1,1.8,1,1]),
    Q('What is the main goal of a user journey map?', ['Show the screens in a final prototype','Visualise the steps and emotions a user goes through to reach a goal','List technical requirements for developers','Track the project timeline'], 1, 'Journey maps reveal pain points and opportunities across the steps a person takes.', .05),
    Q('Which activity best describes empathy in UX practice?', ['Assuming what users want based on team opinion','Understanding users’ needs, context and frustrations','Copying a competitor’s interface','Prioritising stakeholder preferences over everything else'], 1, 'Empathy means grounding decisions in what real users need and experience.', .1),
    Q('Accessibility is only relevant for users with permanent disabilities.', ['True','False'], 1, 'Accessibility also supports temporary and situational limits, such as a broken arm or bright sunlight, and improves usability for everyone.', -.12, [1.3,1])
  ]},
  {id:'q2', name:'UX Principles', ch:'c1', pass:70, time:15, tries:2, qs:[
    Q('Which principle says users should always know what is happening through timely feedback?', ['Visibility of system status','Recognition rather than recall','Aesthetic and minimalist design','Flexibility and efficiency of use'], 0, 'Showing progress, confirmation and state changes keeps people oriented.', .08),
    Q('A Cancel button placed in the same position on every form supports which principle?', ['Consistency and standards','Error prevention','Help and documentation','User control and freedom'], 0, 'Predictable placement and behaviour across screens is the essence of consistency.', -.1, [1,1,1,2]),
    Q('Hick’s Law says decision time increases with…', ['The size of the target','The number and complexity of choices','The distance to the target','The age of the user'], 1, 'More options mean longer decisions, which is why menus should be kept focused.', -.05),
    Q('Fitts’s Law predicts that the time to reach a target depends on…', ['The number of options','The distance to and size of the target','Colour contrast','Screen resolution'], 1, 'Larger and closer targets are faster to hit, which guides button sizing and placement.', -.22, [2,1,1,1]),
    Q('In Gestalt principles, ‘proximity’ means…', ['Elements close together are perceived as related','Similar-coloured elements are grouped','The mind completes incomplete shapes','Larger elements look more important'], 0, 'Spacing alone can group or separate content without extra lines or boxes.', -.02),
    Q('Good error messages should…', ['Show a technical error code only','Explain what went wrong and how to fix it in plain language','Blame the user’s input','Disappear automatically after one second'], 1, 'Helpful errors are specific, polite and tell people how to recover.', .12)
  ]},
  {id:'q3', name:'Research Methods', ch:'c2', pass:65, time:15, tries:2, qs:[
    Q('Which method most efficiently collects data from many users at once?', ['Survey or questionnaire','One-on-one interview','Ethnographic observation','Co-design workshop'], 0, 'Surveys scale to large samples quickly, though they offer less depth than interviews.', .05),
    Q('Usability testing primarily evaluates…', ['Market size','How easily users can complete tasks with a design','Brand awareness','Server performance'], 1, 'The aim is to see where people struggle while completing realistic tasks.', .1),
    Q('Qualitative research mainly answers which kind of question?', ['How many','Why and how','How much','How often'], 1, 'Qualitative methods explain motivations and behaviour. Quantitative methods measure scale.', -.12, [1.8,1,1,1]),
    Q('A card sorting study helps designers to…', ['Test button colours','Understand how users group and label content','Measure page speed','Estimate development cost'], 1, 'Card sorting informs navigation and information architecture.', -.18),
    Q('Confirmation bias in research means…', ['Choosing a very large sample','Favouring data that supports existing beliefs','Testing with experts only','Recording sessions without consent'], 1, 'Researchers must watch for seeking or interpreting evidence in ways that confirm what they already think.', -.32, [1,1,1.7,1]),
    Q('Testing with about five users per round often reveals most major usability problems.', ['True','False'], 0, 'Small, repeated rounds uncover most major issues quickly, and fixes can be verified in the next round.', -.05)
  ]},
  {id:'q4', name:'Interview Planning', ch:'c2', pass:70, time:15, tries:2, qs:[
    Q('Which is the best question to ask in a user interview?', ['Don’t you think the checkout is confusing?','Walk me through the last time you bought something online.','Would you use a feature that does X?','You like dark mode, right?'], 1, 'Asking about past behaviour produces more reliable insight than hypothetical or leading questions.', .06),
    Q('Before interviews begin, you should…', ['Define research goals and screen participants','Design the final UI','Choose a colour palette','Launch the product'], 0, 'Clear goals and the right participants make the sessions worth running.', .12),
    Q('A leading question…', ['Allows completely open answers','Suggests a preferred answer to the participant','Starts the session','Summarises the findings'], 1, 'Leading questions bias answers, so rephrase them neutrally.', -.02),
    Q('What is the right approach to participant consent?', ['Do not mention recording','Obtain informed consent before recording','Ask for it after the session','Skip it when responses are anonymous'], 1, 'Participants must understand and agree to how the session will be recorded and used before it starts.', .15),
    Q('An interview discussion guide should be treated as…', ['A rigid script','A flexible outline that keeps the conversation on topic','A legal contract','A list of solutions to pitch'], 1, 'The guide supports the conversation while leaving room to follow interesting threads.', -.08, [2,1,1,1]),
    Q('Which follow-up best probes for more depth?', ['Next question, please.','Can you tell me more about that?','I agree.','Yes or no?'], 1, 'Open prompts encourage participants to elaborate in their own words.', 0)
  ]},
  {id:'q5', name:'Wireframe Knowledge Check', ch:'c3', pass:70, time:15, tries:2, qs:[
    Q('Low-fidelity wireframes are mainly used to…', ['Finalise visual polish','Explore structure and layout quickly','Test server load','Produce marketing images'], 1, 'They keep attention on structure and flow before visual styling.', .05),
    Q('Which element is usually left out of a low-fidelity wireframe?', ['Content hierarchy','Navigation placement','Final brand colours and imagery','Primary call to action'], 2, 'Final styling comes later, once structure has been validated.', -.04),
    Q('Annotations in wireframes are used to…', ['Add decoration','Explain behaviour and logic to stakeholders and developers','Increase file size','Replace user testing'], 1, 'Notes capture interactions and rules that a static layout cannot show.', 0),
    Q('A sitemap shows…', ['Colour usage','The structure and hierarchy of pages','Server architecture','Animation timing'], 1, 'It maps how content is organised and how pages relate.', .08),
    Q('In left-to-right languages, people often scan web pages in an F-shaped pattern.', ['True','False'], 0, 'Eye-tracking studies show an F-shaped scan on text-heavy pages, so key content belongs at the top and left.', -.24, [1,1.5]),
    Q('Which layout approach best supports responsive design?', ['Fixed pixel widths only','A flexible column grid with breakpoints','Absolute positioning for everything','One large image'], 1, 'Flexible grids adapt content across screen sizes.', .02)
  ]},
  {id:'q6', name:'Visual Design Basics', ch:'c4', pass:60, time:15, tries:2, qs:[
    Q('What is the WCAG AA minimum contrast ratio for normal body text?', ['2:1','3:1','4.5:1','7:1'], 2, 'AA requires 4.5:1 for normal text. 3:1 applies to large text, and 7:1 is the AAA level.', -.27, [1,2,1,1.6]),
    Q('Visual hierarchy is created mainly through…', ['Size, weight, colour and spacing','Random placement','Using as many fonts as possible','Hiding secondary content'], 0, 'Contrast in scale, weight, colour and space tells people what to read first.', .1),
    Q('Which choice improves readability of long text?', ['Very long lines','Comfortable line length and line height','All-caps paragraphs','Tight letter spacing'], 1, 'Moderate line lengths and generous line height reduce reading effort.', .04),
    Q('Whitespace in UI design is wasted space.', ['True','False'], 1, 'Whitespace groups content, improves focus and makes interfaces easier to scan.', .06),
    Q('Primary buttons should…', ['Look identical to every other action','Stand out as the main action on the screen','Be hidden in a menu','Use low contrast'], 1, 'A clear primary action helps people decide what to do next.', .1),
    Q('Why should colour alone not be used to show status?', ['Colour is expensive','Some users cannot distinguish certain colours','Browsers block colour','It slows loading'], 1, 'Pair colour with text, icons or patterns so everyone can understand the status.', -.04)
  ]},
  /* Curriculum-level quiz: assigned directly to the curriculum, not mapped to any chapter */
  {id:'q7', name:'Accessibility Check', ch:null, pass:70, time:15, tries:2, qs:[
    Q('Which approach meets the text alternative need for an informative image?', ['Provide meaningful alt text','Leave alt empty for every image','Use the file name as alt text','Hide the image from everyone'], 0, 'Informative images need a short text alternative that conveys their purpose.', .1),
    Q('Which feature helps keyboard-only users see where they are on a page?', ['A visible focus indicator','An auto-playing carousel','A smaller font size','Disabled scrolling'], 0, 'A clear focus style shows which control is active as people tab through the page.', .05),
    Q('Placeholder text can replace a visible form label.', ['True','False'], 1, 'Placeholders disappear when typing and often have low contrast. Keep a persistent visible label.', -.2, [1.5,1]),
    Q('Which choice avoids relying on colour alone to show an error?', ['A red border only','A red border plus an icon and message text','A green border','Bold text only'], 1, 'Combine colour with text and icons so the error is perceivable by everyone.', -.1),
    Q('Screen reader users often move quickly through a page by using…', ['Heading structure and landmarks','Mouse hover states','Colour themes','Animations'], 0, 'Headings and landmarks give a navigable outline of the page.', -.28, [1,1.8,1,1]),
    Q('Captions on video mainly benefit…', ['Only people who speak another language','People who are deaf or hard of hearing, and many others in noisy or quiet settings','Only developers','Nobody'], 1, 'Captions support a wide range of situations beyond hearing loss.', .08)
  ]}
];
const QZ = {}; QL.forEach(q => QZ[q.id] = q);
const mapLabel = q => q.ch ? CHM[q.ch].name : 'Curriculum-level quiz';
const mapChip = q => '<span class="chip ' + (q.ch ? 'map' : 'cl') + '">' + esc(mapLabel(q)) + '</span>';
const CH_QUIZ_COUNT = CH.map(c => QL.filter(q => q.ch === c.id).length);
const CUM = []; (function () { let s = 0; CH_QUIZ_COUNT.forEach((n, i) => { s += n; CUM[i] = s; }); })();
const MAPPED = QL.filter(q => q.ch).length;

const FIRST = ['Aanya','Vikram','Meera','Rohan','Sofia','Liam','Priya','Arjun','Emma','Noah','Isha','Kabir','Olivia','Ethan','Diya','Rahul','Maya','Lucas','Ananya','Daniel','Nisha','Omar','Zara','Karthik','Leah','Sanjay','Grace','Imran','Tara','Joel','Harini','Marcus','Lakshmi','Owen','Fatima','Dev','Chloe','Naveen','Ruth','Aditya'];
const LAST = ['Sharma','Iyer','Patel','Nair','Reddy','Menon','Kapoor','Thomas','Walker','Fernandes','Das','Khan','Murphy','Gupta','Rao','Chen','Bose','Pillai','Joseph','Singh','Mehta','Lopez','Hughes','Verma','Krishnan','Ahmed','Shah','Bennett','Varma','Ortiz'];

let LS = [], LM = {}, ATT = {};

function build() {
  const r = rng(20261014);
  const mkTs = d => {
    const day = Math.floor(d);
    const t = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate() - day, 8 + Math.floor(r() * 11), Math.floor(r() * 60));
    if (t > NOW) t.setHours(8, Math.floor(r() * 29));
    return t.getTime();
  };
  LS = []; LM = {}; ATT = {}; QL.forEach(q => ATT[q.id] = {});

  /* One attempt for one learner and quiz. status: 'submitted' | 'progress' */
  function attempt(quiz, l, status, ts) {
    const total = quiz.qs.length, ans = [];
    const hasty = status === 'submitted' && r() < .06;           /* submitted with many blanks */
    const savedUpTo = status === 'progress' ? 1 + Math.floor(r() * (total - 1)) : total;
    let answered = 0, correct = 0;
    quiz.qs.forEach((q, j) => {
      let a = null;
      const skip = status === 'progress' ? j >= savedUpTo : r() < (hasty ? .5 : .015);
      if (!skip) {
        const p = Math.max(.08, Math.min(.97, l.ability + q.e));
        if (r() < p) a = q.c;
        else {
          const idx = q.o.map((_, n) => n).filter(n => n !== q.c);
          const w = idx.map(n => q.w ? q.w[n] : 1);
          let x = r() * w.reduce((s, v) => s + v, 0); a = idx[idx.length - 1];
          for (let n = 0; n < idx.length; n++) { x -= w[n]; if (x <= 0) { a = idx[n]; break; } }
        }
      }
      ans.push(a);
      if (a !== null) { answered++; if (a === q.c) correct++; }
    });
    const at = {lid:l.id, qid:quiz.id, status, ts, ans, answered, correct, total, score:null, secs:null, result:null};
    if (status === 'submitted') {
      /* Prototype assumption: score = correct answers / total questions. Unanswered questions earn no marks. */
      at.score = Math.round(correct / total * 100);
      at.result = at.score >= quiz.pass ? 'passed' : 'failed';
      at.secs = Math.round(Math.max(answered, 1) * (35 + r() * 55));
    }
    ATT[quiz.id][l.id] = at;
    return at;
  }

  const st = [];
  for (let i = 0; i < 48; i++) st.push('completed');
  for (let i = 0; i < 54; i++) st.push('progress');
  for (let i = 0; i < 18; i++) st.push('notstarted');
  for (let i = st.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = st[i]; st[i] = st[j]; st[j] = t; }

  for (let i = 0; i < ASSIGNED; i++) {
    const fn = FIRST[i % 40], ln = LAST[(i * 7 + Math.floor(i / 40) * 3) % 30];
    const l = {
      id: 'L' + String(i + 1).padStart(3, '0'), name: fn + ' ' + ln,
      email: (fn + '.' + ln).toLowerCase() + '@acme-learning.example',
      ini: fn[0] + ln[0], av: (i * 5 + fn.length) % 6,
      status: st[i], ability: 0.6 + r() * 0.38,
      chapters: 0, progress: 0, last: null, ack: {done:false, ts:null}
    };
    let kSub = 0, progIdx = -1, q7 = 'none';
    if (l.status === 'completed') { l.chapters = CH.length; l.progress = 100; kSub = MAPPED; q7 = 'sub'; }
    else if (l.status === 'progress') {
      const x = r();
      l.chapters = x < .15 ? 0 : x < .45 ? 1 : x < .75 ? 2 : 3;
      kSub = (l.chapters ? CUM[l.chapters - 1] : 0) + (r() < (l.chapters === 3 ? .3 : .55) ? 1 : 0);
      if (kSub < MAPPED && r() < .4) progIdx = kSub;
      const y = r(); q7 = y < .35 ? 'sub' : y < .5 ? 'prog' : 'none';
      l.progress = Math.min(96, Math.round(l.chapters * 25 + 4 + r() * 19));
    }
    const start = 25 + r() * 60, gap = 3 + r() * 6;
    let lastTs = 0;
    const note = ts => { if (ts > lastTs) lastTs = ts; };
    for (let qi = 0; qi < kSub; qi++) note(attempt(QL[qi], l, 'submitted', mkTs(Math.max(0, start - qi * gap - r() * 1.5))).ts);
    if (progIdx >= 0) note(attempt(QL[progIdx], l, 'progress', mkTs(r() * 8)).ts);
    const acc = QZ.q7;
    if (q7 === 'sub') note(attempt(acc, l, 'submitted', mkTs(r() * 35)).ts);
    else if (q7 === 'prog') note(attempt(acc, l, 'progress', mkTs(r() * 8)).ts);
    l.last = lastTs || (l.status === 'progress' ? mkTs(r() * 20) : null);
    const pa = l.status === 'completed' ? .92 : l.status === 'progress' ? .45 : .1;
    if (r() < pa) l.ack = {done:true, ts: mkTs(r() * 55)};
    LS.push(l); LM[l.id] = l;
  }
}

/* ---- state + period-aware accessors ---- */
const PERIODS = {all:'All time', '30':'Last 30 days', '7':'Last 7 days'};
const S = {
  tab:'overview', sub:'summary', period:'all', hist:[],
  quizId:'q1', chapter:'all', q:0,
  ov:{search:'', filter:'all', sortKey:'name', sortDir:1, page:1},
  qs:{search:'', quiz:'all', att:'all', res:'all', sort:'recent', page:1},
  rs:{search:'', filter:'all', page:1},
  ack:{search:'', filter:'all', page:1}
};
const inP = ts => S.period === 'all' || ts >= NOW.getTime() - Number(S.period) * 864e5;
const attemptOf = (lid, qid) => { const a = ATT[qid][lid]; return a && inP(a.ts) ? a : null; };
const getAtt = qid => Object.values(ATT[qid]).filter(a => inP(a.ts));
const attState = a => a ? a.status : 'notstarted';

function quizStats(qid) {
  const at = getAtt(qid), sub = at.filter(a => a.status === 'submitted'), n = sub.length;
  const passed = sub.filter(a => a.result === 'passed').length;
  const earned = sub.reduce((s, a) => s + a.correct, 0), avail = sub.reduce((s, a) => s + a.total, 0);
  return {n, passed, failed:n - passed, prog:at.length - n, notStarted:ASSIGNED - at.length,
    earned, avail, avg: n ? Math.round(earned / avail * 100) : null, passRate: n ? Math.round(passed / n * 100) : null};
}
function overallStats() {
  const per = QL.map(q => quizStats(q.id));
  const n = per.reduce((s, x) => s + x.n, 0), earned = per.reduce((s, x) => s + x.earned, 0), avail = per.reduce((s, x) => s + x.avail, 0);
  return {per, n, passed: per.reduce((s, x) => s + x.passed, 0), failed: per.reduce((s, x) => s + x.failed, 0), prog: per.reduce((s, x) => s + x.prog, 0),
    withSubs: per.filter(x => x.n > 0).length, avg: n ? Math.round(earned / avail * 100) : null, earned, avail};
}
/* Option distribution counts submitted answers only. Unanswered is separate and is not marked incorrect. */
function qStats(qid, j) {
  const q = QZ[qid].qs[j], sub = getAtt(qid).filter(a => a.status === 'submitted'), counts = q.o.map(() => 0);
  let answered = 0;
  sub.forEach(a => { const v = a.ans[j]; if (v !== null) { counts[v]++; answered++; } });
  const correct = counts[q.c];
  return {counts, answered, skipped: sub.length - answered, correct, incorrect: answered - correct, pct: answered ? correct / answered * 100 : null, n: sub.length};
}
const REVIEW = 60, HIGH = 85;
const tone = p => p === null ? 'none' : p < REVIEW ? 'review' : p >= HIGH ? 'high' : 'mid';

/* =====================================================================
   QUIZ SUMMARY (all quizzes in the curriculum)
   ===================================================================== */
function sumRows() {
  const s = S.qs.search.trim().toLowerCase(), f = S.qs;
  const rows = [];
  LS.forEach(l => {
    if (s && !(l.name.toLowerCase().includes(s) || l.email.includes(s))) return;
    QL.forEach((quiz, qi) => {
      if (f.quiz !== 'all' && quiz.id !== f.quiz) return;
      const a = attemptOf(l.id, quiz.id), st = attState(a);
      if (f.att !== 'all' && st !== f.att) return;
      const res = a ? a.result : null;
      if (f.res === 'none') { if (res) return; } else if (f.res !== 'all' && res !== f.res) return;
      rows.push({l, quiz, qi, a, st});
    });
  });
  const byL = (x, y) => x.l.name.localeCompare(y.l.name) || x.qi - y.qi;
  const sc = x => x.a && x.a.status === 'submitted' ? x.a.score : null;
  rows.sort((x, y) => {
    switch (f.sort) {
      case 'learner': return byL(x, y);
      case 'quiz': return x.qi - y.qi || x.l.name.localeCompare(y.l.name);
      case 'high': case 'low': {
        const a = sc(x), b = sc(y);
        if (a === null && b === null) return byL(x, y);
        if (a === null) return 1; if (b === null) return -1;
        return (f.sort === 'high' ? b - a : a - b) || byL(x, y);
      }
      default: {
        const a = x.a ? x.a.ts : 0, b = y.a ? y.a.ts : 0;
        if (!a && !b) return byL(x, y);
        return (b - a) || byL(x, y);
      }
    }
  });
  return rows;
}

    const s = qStats(quiz.id, j), t = tone(s.pct), cur = j === S.q;
    const mk = t === 'high' ? '✓' : t === 'review' ? '!' : '';
    const lbl = 'Question ' + (j + 1) + (s.pct === null ? ', no submitted responses' : ', ' + Math.round(s.pct) + '% correct') + (t === 'review' ? ', needs review' : t === 'high' ? ', high performing' : '') + (cur ? ', current question' : '');

function mxRows() {
  const quiz = QZ[S.quizId], s = S.rs.search.trim().toLowerCase(), f = S.rs.filter;
  const ord = {submitted:0, progress:1, notstarted:2};
  return LS.map(l => { const a = attemptOf(l.id, quiz.id); return {l, a, st: attState(a)}; })
    .filter(x => (!s || x.l.name.toLowerCase().includes(s) || x.l.email.includes(s)) &&
      (f === 'all' || f === x.st || (f === 'passed' && x.a && x.a.result === 'passed') || (f === 'failed' && x.a && x.a.result === 'failed')))
    .sort((a, b) => ord[a.st] - ord[b.st] || a.l.name.localeCompare(b.l.name));
}
function mxCell(x, j, quiz) {
  const cur = j === S.q ? 'col-cur' : '', a = x.a, q = quiz.qs[j];
  if (!a) return '<td class="' + cur + '"><span class="cell c-na" aria-label="' + esc(x.l.name) + ', question ' + (j + 1) + ': no attempt, quiz not started">·</span></td>';
  const v = a.ans[j]; let cls, txt, lbl;
  if (v === null) { cls = 'c-none'; txt = '—'; lbl = a.status === 'progress' ? 'not answered yet, quiz in progress' : 'unanswered'; }
  else if (a.status === 'progress') { cls = 'c-saved'; txt = LETTERS[v]; lbl = 'selected ' + LETTERS[v] + ', saved but not submitted'; }
  else if (v === q.c) { cls = 'c-ok'; txt = LETTERS[v] + ' ✓'; lbl = 'selected ' + LETTERS[v] + ', correct'; }
  else { cls = 'c-bad'; txt = LETTERS[v] + ' ×'; lbl = 'selected ' + LETTERS[v] + ', incorrect'; }
  return '<td class="' + cur + '"><button class="cell ' + cls + '" id="mx-' + x.l.id + '-' + j + '" data-action="mxCell" data-learner="' + x.l.id + '" data-q="' + j + '" aria-label="' + esc(x.l.name) + ', question ' + (j + 1) + ': ' + lbl + '. Open details">' + txt + '</button></td>';
}

let ready = false;
function render() {
  if (!ready) return;
  const ae = document.activeElement, id = ae && ae.id;
  const sel = ae && ae.tagName === 'INPUT' ? [ae.selectionStart, ae.selectionEnd] : null;
  const keep = {}; $$('.mx-wrap').forEach(n => keep.mx = [n.scrollLeft, n.scrollTop]);
  renderChrome();
  try {
    if (S.tab === 'overview') renderOverview();
    else if (S.tab === 'quiz') { if (S.sub === 'summary') renderSummary(); else renderResponses(); }
    else renderAck();
  } catch (err) { showError(err); return; }
  const mx = $('.mx-wrap'); if (mx && keep.mx) { mx.scrollLeft = keep.mx[0]; mx.scrollTop = keep.mx[1]; }
  if (id) { const n = document.getElementById(id); if (n && n !== document.activeElement) { n.focus({preventScroll:true}); if (sel && n.setSelectionRange) { try { n.setSelectionRange(sel[0], sel[1]); } catch (e) {} } } }
}
function showError(err) {
  console.error(err);
  const host = S.tab === 'quiz' ? $('#sub-' + S.sub) : $('#panel-' + S.tab);
  host.innerHTML = '<div class="card">' + empty('Something went wrong', 'The results could not be displayed. Try again, and if the problem continues, reload the page.', '<button class="btn btn-primary sm" data-action="retry">Try again</button>') + '</div>';
}
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3800);
}
function go(tab, sub) {
  if (tab !== S.tab || (sub && sub !== S.sub)) S.hist.push({tab:S.tab, sub:S.sub});
  S.tab = tab; if (sub) S.sub = sub;
  render(); window.scrollTo({top:0});
}

/* =====================================================================
   CSV export
   ===================================================================== */
function csv(name, rows) {
  const body = rows.map(r => r.map(v => { v = v === null || v === undefined ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob(['\ufeff' + body], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast('Exported ' + (rows.length - 1) + ' rows to ' + name);
}
const iso = ts => ts ? new Date(ts).toISOString().slice(0, 16).replace('T', ' ') : '';
const STL = {completed:'Completed', progress:'In progress', notstarted:'Not started', submitted:'Submitted'};
function exportReport() {
  if (S.tab === 'overview') {
    csv('learner-progress.csv', [['Learner', 'Email', 'Curriculum progress %', 'Chapters completed', 'Quiz average %', 'Last activity', 'Status']].concat(
      ovRows().map(x => [x.l.name, x.l.email, x.l.progress, x.l.chapters + ' of ' + CH.length, x.avg === null ? '' : x.avg, iso(x.l.last), STL[x.l.status]])));
  } else if (S.tab === 'quiz' && S.sub === 'summary') {
    csv('learner-quiz-results.csv', [['Learner', 'Email', 'Quiz', 'Mapping', 'Questions answered', 'Total questions', 'Score %', 'Attempt status', 'Result', 'Last activity']].concat(
      sumRows().map(x => [x.l.name, x.l.email, x.quiz.name, mapLabel(x.quiz), x.a ? x.a.answered : '', x.quiz.qs.length, x.a && x.a.status === 'submitted' ? x.a.score : '', x.st === 'progress' ? 'In progress' : STL[x.st], x.a && x.a.result ? x.a.result : '', x.a ? iso(x.a.ts) : ''])));
  } else if (S.tab === 'quiz') {
    const quiz = QZ[S.quizId];
    const hdr = ['Learner', 'Email', 'Attempt status', 'Score %', 'Result'].concat(quiz.qs.map((q, j) => 'Q' + (j + 1)));
    csv('answer-matrix-' + quiz.id + '.csv', [hdr].concat(mxRows().map(x => {
      const a = x.a;
      return [x.l.name, x.l.email, x.st === 'progress' ? 'In progress' : STL[x.st], a && a.status === 'submitted' ? a.score : '', a && a.result ? a.result : ''].concat(quiz.qs.map((q, j) => {
        if (!a) return 'Not started';
        const v = a.ans[j];
        if (v === null) return a.status === 'progress' ? 'Not answered yet' : 'Unanswered';
        if (a.status === 'progress') return LETTERS[v] + ' (saved)';
        return LETTERS[v] + (v === q.c ? ' correct' : ' incorrect');
      }));
    })));
  } else {
    csv('acknowledgements.csv', [['Learner', 'Email', 'Curriculum status', 'Acknowledgement', 'Acknowledged on']].concat(
      ackRows().map(l => [l.name, l.email, STL[l.status], l.ack.done ? 'Acknowledged' : 'Pending', iso(l.ack.ts)])));
  }
}

  tab: el => go(el.dataset.tab),
  subtab: el => go('quiz', el.dataset.sub),
  viewLearner: el => { const l = LM[el.dataset.learner]; S.qs = {search:l.name, quiz:'all', att:'all', res:'all', sort:'recent', page:1}; go('quiz', 'summary'); },
  viewResponses: el => toResponses(el.dataset.quiz, ''),
  rowResponses: el => toResponses(el.dataset.quiz, LM[el.dataset.learner].name),
  quizDetails: el => quizDetails(el.dataset.quiz),
  filterRes: el => { S.qs.res = el.dataset.res; S.qs.page = 1; render(); const t = $('#qsTable'); if (t) t.scrollIntoView({behavior:'smooth', block:'start'}); },
  ovSort: el => { const k = el.dataset.key; if (S.ov.sortKey === k) S.ov.sortDir *= -1; else { S.ov.sortKey = k; S.ov.sortDir = 1; } S.ov.page = 1; render(); },
  ovClear: () => { S.ov.search = ''; S.ov.filter = 'all'; S.ov.page = 1; render(); },
  qsClear: () => { S.qs = {search:'', quiz:'all', att:'all', res:'all', sort:S.qs.sort, page:1}; render(); },
  mxClear: () => { S.rs.search = ''; S.rs.filter = 'all'; S.rs.page = 1; render(); },
  ackClear: () => { S.ack.search = ''; S.ack.filter = 'all'; S.ack.page = 1; render(); },
  page: el => { if (el.disabled) return; S[el.dataset.scope].page = Number(el.dataset.page); render(); },
  rsQ: el => { S.q = Number(el.dataset.q); render(); },
  mxCell: el => cellDetail(el.dataset.learner, Number(el.dataset.q)),
  mxStats: el => { S.q = Number(el.dataset.q); $('#dlg').close(); render(); const t = $('#osT'); if (t) t.scrollIntoView({behavior:'smooth', block:'start'}); },
  closeDlg: () => $('#dlg').close(),
  remind: el => toast('Prototype action: a reminder would be sent to ' + LM[el.dataset.learner].name + '. Nothing was sent.'),
  remindAll: () => toast('Prototype action: reminders would be sent to ' + LS.filter(l => !l.ack.done).length + ' learners. Nothing was sent.'),
  export: exportReport,
  retry: () => render(),
  back: () => { const p = S.hist.pop(); if (p) { S.tab = p.tab; S.sub = p.sub; render(); window.scrollTo({top:0}); } else toast('Prototype: Back would return to the curriculum list.'); },
  railNav: el => { if (el.dataset.name === 'Learning') { closeMenu(); return; } toast('Prototype: ' + el.dataset.name + ' is not part of this demo. You are in Learning, Curriculum results.'); },
  toggleRail: el => { const on = document.body.classList.toggle('rail-expanded'); el.setAttribute('aria-expanded', on); el.setAttribute('aria-label', on ? 'Collapse navigation' : 'Expand navigation'); },
  openMenu: () => { $('#rail').classList.add('open'); $('#scrim').classList.add('show'); },
  closeMenu
};
document.addEventListener('click', e => {
  const d = $('#dlg'); if (e.target === d) { d.close(); return; }
  const el = e.target.closest('[data-action]');
  if (!el || !A[el.dataset.action]) return;
  A[el.dataset.action](el, e);
});
const I = {
  ovSearch: v => { S.ov.search = v; S.ov.page = 1; },
  qsSearch: v => { S.qs.search = v; S.qs.page = 1; },
  rsSearch: v => { S.rs.search = v; S.rs.page = 1; },
  ackSearch: v => { S.ack.search = v; S.ack.page = 1; }
};
const C = {
  period: v => { S.period = v; S.ov.page = 1; S.qs.page = 1; S.rs.page = 1; },
  org: () => toast('Prototype: organization switching is not connected, so the same sample data is shown.'),
  ovFilter: v => { S.ov.filter = v; S.ov.page = 1; },
  qsQuiz: v => { S.qs.quiz = v; S.qs.page = 1; },
  qsAtt: v => { S.qs.att = v; S.qs.page = 1; },
  qsRes: v => { S.qs.res = v; S.qs.page = 1; },
  qsSort: v => { S.qs.sort = v; S.qs.page = 1; },
  rsChapter: v => { S.chapter = v; const list = quizzesIn(v); if (!list.some(q => q.id === S.quizId)) setQuiz(list[0].id); },
  rsQuiz: v => setQuiz(v),
  rsFilter: v => { S.rs.filter = v; S.rs.page = 1; },
  ackFilter: v => { S.ack.filter = v; S.ack.page = 1; }
};
document.addEventListener('input', e => { const f = I[e.target.id]; if (f) { f(e.target.value); render(); } });
document.addEventListener('change', e => { const f = C[e.target.id]; if (f) { f(e.target.value); if (e.target.id !== 'org') render(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeMenu();
  const t = e.target.closest && e.target.closest('[role=tab]');
  if (!t || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return;
  const tabs = $$('[role=tab]', t.parentElement), i = tabs.indexOf(t);
  const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
  n.focus(); n.click(); e.preventDefault();
});

function init() {
  try { build(); ready = true; render(); }
  catch (err) { ready = true; showError(err); }
}
setTimeout(init, 450);
window.__lms = {S, QL, get LS() { return LS; }, quizStats, qStats, overallStats, ATT: () => ATT, render};
})();
</script>
</body>
</html>
